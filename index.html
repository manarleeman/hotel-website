<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <nav class="primary-navigation">
            <div class="nav-controls">
                <button id="menu-toggle" class="hamburger-btn">
                    <svg width="32" height="22" viewBox="0 0 32 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <line y1="1" x2="32" y2="1" stroke="#333333" stroke-width="2" />
                        <line y1="11" x2="32" y2="11" stroke="#333333" stroke-width="2" />
                        <line y1="21" x2="32" y2="21" stroke="#333333" stroke-width="2" />
                    </svg>
                </button>
                <button id="menu-close" class="close-btn is-hidden">
                    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 25L25 1M25 25L1 1" stroke="#333333" stroke-width="2" />
                    </svg>
                </button>
            </div>
            
            <div class="brand-logo">
                <h1 class="logo-text"><span class="brand-accent">Your</span>.logo</h1>
            </div>
            
            <div class="user-profile">
                <button class="profile-btn">
                    <img src="assert/icon.svg" alt="user profile" class="profile-icon" />
                </button>
            </div>
            
            <!-- Mobile Navigation Menu -->
            <div class="mobile-nav is-hidden" id="mobile-navigation">
                <ul class="nav-links">
                    <li><a href="#" class="nav-link">Last Minute Deals</a></li>
                    <li><a href="#" class="nav-link">Blog</a></li>
                    <li><a href="#" class="nav-link">About Us</a></li>
                    <li><a href="#" class="nav-link">Contacts</a></li>
                </ul>
                
                <div class="utility-icons">
                    <img src="./assert/money.png" alt="currency" class="currency-icon" />
                    <img src="./assert/language.png" alt="language" class="language-icon" />
                </div>

                <div class="social-media">
                    <a href="#" class="social-link"><img src="./assert/Phone_black.svg" alt="phone" /></a>
                    <a href="#" class="social-link"><img src="./assert/face-book-block.svg" alt="facebook" /></a>
                    <a href="#" class="social-link"><img src="./assert/Youtube.svg" alt="youtube" /></a>
                    <a href="#" class="social-link"><img src="./assert/Telegram.svg" alt="telegram" /></a>
                    <a href="#" class="social-link"><img src="./assert/Instagram.svg" alt="instagram" /></a>
                </div>
            </div>
        </nav>
    </header>
    <script src="scripts.js"></script>
</body>
</html>
